name: Destroy (manual)

# Ferramenta permanente de disciplina de custo do Learner Lab
# (PHASE_3_EXECUTION_GUIDE.md, Passo 9) -- nunca dispara sozinho, só via
# "Run workflow" na aba Actions. Ordem correta ao destruir os 3 repos de
# infra: este (auth-lambda) primeiro, depois k8s-infra, depois db-infra por
# último -- inversa da ordem de apply.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar'
        required: true
      workspace:
        description: 'Workspace do Terraform a destruir'
        required: true
        default: 'homolog'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.5"

jobs:
  destroy:
    name: Destroy
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Empacotar as Lambdas (terraform.tfvars referencia os .zip em dist/ mesmo pra destroy)
        working-directory: .
        run: |
          npm ci
          npm run package

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: terraform
        run: terraform init

      - name: Selecionar workspace
        working-directory: terraform
        run: terraform workspace select "${{ github.event.inputs.workspace }}"

      - name: terraform destroy
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false
